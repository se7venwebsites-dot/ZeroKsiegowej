<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Logowanie - ZeroKsięgowa AI</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
          tailwind.config = {
            darkMode: "class",
            theme: {
              extend: {
                colors: {
                  "primary": "#004ac6",
                  "surface": "#f7f9fb"
                },
                fontFamily: { "body": ["Inter"] },
                borderRadius: { "xl": "1rem" }
              }
            }
          }
    </script>
    <style>
      .glass-effect { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
      .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>
<body class="bg-surface font-body text-slate-900 min-h-screen flex flex-col antialiased">
    <!-- TopNavBar -->
    <nav class="fixed top-0 w-full z-50 bg-white/70 backdrop-blur-xl">
        <div class="flex justify-between items-center px-6 py-4 max-w-7xl mx-auto">
            <div class="text-xl font-extrabold tracking-tighter text-slate-900 cursor-pointer" onclick="window.location.href='landing.html'">
                ZeroKsięgowa
            </div>
            <div class="flex items-center gap-6">
                <a class="text-slate-600 font-medium hover:text-blue-700 transition-colors" href="register.html">Zarejestruj się</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center px-4 pt-24 pb-12 relative overflow-hidden">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-500/5 rounded-full blur-3xl"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-emerald-500/5 rounded-full blur-3xl"></div>
        
        <div class="w-full max-w-[440px] z-10">
            <div class="glass-effect p-8 md:p-10 rounded-2xl shadow-xl border border-white/50">
                <div class="mb-10 text-center">
                    <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 mb-2">Witaj ponownie</h1>
                    <p class="text-slate-500 text-sm font-medium">Zaloguj się do swojego centrum finansowego</p>
                </div>

                <div class="grid grid-cols-2 gap-3 mb-8">
                    <button class="flex items-center justify-center gap-2 py-3 px-4 bg-white rounded-xl hover:bg-slate-50 transition-all border border-slate-100">
                        <span class="text-sm font-semibold">Google</span>
                    </button>
                    <button class="flex items-center justify-center gap-2 py-3 px-4 bg-white rounded-xl hover:bg-slate-50 transition-all border border-slate-100">
                        <span class="text-sm font-semibold">Apple ID</span>
                    </button>
                </div>

                <div class="relative flex items-center gap-4 mb-8">
                    <div class="h-px flex-grow bg-slate-200"></div>
                    <span class="text-[10px] font-bold tracking-widest text-slate-400 uppercase">lub e-mail</span>
                    <div class="h-px flex-grow bg-slate-200"></div>
                </div>

                <form id="loginForm" class="space-y-5">
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-bold text-slate-400 tracking-wider uppercase ml-1">E-mail</label>
                        <input id="loginEmail" class="w-full bg-slate-50 border-none rounded-xl px-4 py-3.5 focus:ring-2 focus:ring-blue-500/10 transition-all" type="email" placeholder="twoj@email.pl" required>
                    </div>
                    <div class="space-y-1.5">
                        <div class="flex justify-between items-center ml-1">
                            <label class="text-[10px] font-bold text-slate-400 tracking-wider uppercase">Hasło</label>
                            <a class="text-xs font-semibold text-blue-600 hover:text-blue-700" href="#">Zapomniałeś?</a>
                        </div>
                        <input id="loginPassword" class="w-full bg-slate-50 border-none rounded-xl px-4 py-3.5 focus:ring-2 focus:ring-blue-500/10 transition-all" type="password" placeholder="••••••••" required>
                    </div>
                    <div id="errorAlert" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm font-medium mb-4"></div>
                    <button id="loginBtn" class="w-full py-4 bg-blue-600 text-white font-bold rounded-xl shadow-lg shadow-blue-200 hover:opacity-95 transition-all active:scale-95" type="submit">
                        Zaloguj się
                    </button>
                </form>

                <div class="mt-8 pt-8 border-t border-slate-100 text-center">
                    <p class="text-sm text-slate-500">
                        Nie masz konta? <a class="text-blue-600 font-bold hover:underline ml-1" href="register.html">Zarejestruj się</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyARy3vOeAQ2LG6xMyuzWnJ2rpH_I6ubGlM",
            authDomain: "zeroksiegowej.firebaseapp.com",
            projectId: "zeroksiegowej",
            storageBucket: "zeroksiegowej.firebasestorage.app",
            messagingSenderId: "763679005684",
            appId: "1:763679005684:web:a19ce63cc3530cf256b7a1"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // If already logged in, redirect
        auth.onAuthStateChanged(user => {
            if (user) window.location.href = '/';
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerText = 'Logowanie...';

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            try {
                // Clear previous errors
                document.getElementById('errorAlert').classList.add('hidden');
                document.getElementById('errorAlert').innerText = '';

                await auth.signInWithEmailAndPassword(email, password);
                window.location.href = '/';
            } catch (err) {
                console.error("Firebase Error:", err);
                const errorBox = document.getElementById('errorAlert');
                errorBox.classList.remove('hidden');
                
                if (err.code === 'auth/invalid-credential' || err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password') {
                    errorBox.innerText = 'Błąd: Nieprawidłowy e-mail lub hasło.';
                } else if (err.code === 'auth/operation-not-allowed') {
                    errorBox.innerHTML = 'Błąd: Logowanie Email/Hasło nie jest włączone w Firebase.<br>Przejdź do Firebase Console → Authentication → Sign-in method, i włącz "Email/Password".';
                } else {
                    errorBox.innerText = 'Błąd Firebase: ' + err.message;
                }
                
                btn.disabled = false;
                btn.innerText = 'Zaloguj się';
            }
        });
    </script>
</body>
</html>
